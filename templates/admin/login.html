{% load static %}<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar na moderação | AcessoJá</title><link rel="stylesheet" href="{% static 'admin/moderation.css' %}"></head><body class="moderation-page mod-login-page"><main class="mod-login-card"><img src="{% static 'admin/acessoja-logo.png' %}" alt=""><h1>AcessoJá</h1><p>Área administrativa</p>{% if form.errors %}<p class="mod-feedback error" role="alert">Confira o nome de usuário e a senha.</p>{% endif %}<form method="post" action="{{ app_path }}">{% csrf_token %}<div class="mod-field">{{ form.username.label_tag }}{{ form.username }}</div><div class="mod-field">{{ form.password.label_tag }}{{ form.password }}</div><input type="hidden" name="next" value="{{ next }}"><button class="mod-button" type="submit">Entrar</button></form></main></body></html>
