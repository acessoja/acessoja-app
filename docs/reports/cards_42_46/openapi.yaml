openapi: 3.0.3
info:
  title: AcessoJá API
  version: 1.0.0
  description: |
    API REST do **AcessoJá** — plataforma para encontrar e avaliar a acessibilidade de estabelecimentos e locais públicos.

    ## Como usar

    O app Flutter identifica o usuário pelo campo `nome` (não pelo e-mail). Faça POST /api/login/ e envie Authorization: Token <token> nos endpoints privados.

    Sessões expiram em 12 horas e são revogadas no logout ou troca de senha. Avaliações são atribuídas à sessão; somente autores e administradores reais podem alterá-las.

    ## Convenções

    - Respostas em JSON UTF-8.
    - Datas em ISO-8601.
    - Erros de validação retornam `400` com o mapa de campos inválidos.
  contact:
    name: Equipe AcessoJá
    url: https://github.com/acessoja/acessoja-app
  license:
    name: Projeto educacional
