- name: Locais
  description: Locais e filtros de acessibilidade.
- name: Visitas
  description: Histórico de locais visitados pelo usuário.
- name: Avaliações
  description: Avaliações de acessibilidade dos locais.
- name: Usuários
  description: Perfil, senha e foto do usuário.
