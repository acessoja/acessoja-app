        name: incluir_desconhecidos
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          enum:
          - name
          - proximity
          - rating
          type: string
          minLength: 1
        description: |-
          * `name` - name
          * `proximity` - proximity
          * `rating` - rating
      - in: query
        name: origens
        schema:
          type: string
          minLength: 1
      - in: query
        name: origin_lat
        schema:
          type: number
          format: double
      - in: query
        name: origin_lon
        schema:
          type: number
          format: double
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 50
          minimum: 1
      - in: query
        name: paginated
        schema:
          type: boolean
        description: O catálogo sempre pagina, inclusive se false.
      - in: query
        name: recursos
        schema:
          type: string
          minLength: 1
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
          maxLength: 180
