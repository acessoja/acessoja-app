  /api/locais/:
    get:
      operationId: api_locais_list
      description: Categorias e origens combinam por OR; todos os recursos são exigidos
        (AND). Desconhecimento é opcional; ausência, divergência, não aplicabilidade
        e acesso parcial são excluídos. Booleanos legados continuam na resposta, sem
        comprovar presença ou ausência.
      summary: Consultar locais com estados explícitos e filtros AND
      parameters:
      - in: query
        name: bbox
        schema:
          type: string
        description: sul,oeste,norte,leste; opcional; aceita antimeridiano.
      - in: query
        name: categorias
        schema:
          type: string
        description: Categorias separadas por vírgula (OR).
      - in: query
        name: incluir_desconhecidos
        schema:
          type: boolean
        description: Padrão false. Só admite unknown adicionalmente.
      - in: query
        name: ordering
        schema:
          type: string
        description: name, proximity (exige origem), rating; ordena antes de paginar.
      - in: query
        name: origens
        schema:
          type: string
        description: acessoja,openstreetmap (OR); este endpoint só lista cadastrados.
      - in: query
        name: origin_lat
        schema:
          type: string
        description: Latitude da origem; não persistida.
      - in: query
        name: origin_lon
        schema:
          type: string
        description: Longitude da origem.
      - in: query
        name: page
        schema:
          type: string
        description: Inteiro positivo.
      - in: query
        name: page_size
        schema:
          type: string
        description: 1..50; padrão 20.
      - in: query
        name: paginated
        schema:
          type: string
        description: 'true: count/next/previous/results; false: lista legada (padrão).'
      - in: query
        name: recursos
        schema:
          type: string
        description: IDs do catálogo separados por vírgula (AND).
      - in: query
        name: search
        schema:
          type: string
        description: Nome ou endereço; máximo 180 caracteres.
      tags:
      - Locais
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Local'
                  - type: object
                    required:
                    - count
                    - next
                    - previous
                    - results
                    properties:
                      count:
                        type: integer
                      next:
                        type: string
                        nullable: true
                      previous:
                        type: string
                        nullable: true
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Local'
              examples:
                RecursosInformados:
                  value:
                  - accessibility_information: {}
                    accessibility:
                      rampa_acesso:
                        state: unknown
                        evidence: []
                        community_state: not_evaluated
                        legacy_not_comparable: 0
                    missing_resources: []
                  summary: Recursos informados
          description: ''
    post:
      operationId: api_locais_create
      tags:
      - Locais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocalRequest'
        required: true
      security:
