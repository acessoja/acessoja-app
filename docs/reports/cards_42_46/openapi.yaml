  /api/evidencias/:
    get:
      operationId: api_evidencias_list
      parameters:
      - in: query
        name: external_id
        schema:
          type: string
          minLength: 1
          pattern: ^osm:(node|way|relation):[1-9][0-9]{0,18}$
      - in: query
        name: local_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: resource
        schema:
          enum:
          - rampa_acesso
          - vagas_reservadas
          - banheiro_acessivel
          - mesa_acessivel
          - cardapio_braille
          - atendimento_libras
          - sinalizacao_tatil
          - cao_guia
          - piso_tatil
          - sinalizacao_visual
          type: string
          minLength: 1
        description: |-
          * `rampa_acesso` - rampa_acesso
          * `vagas_reservadas` - vagas_reservadas
          * `banheiro_acessivel` - banheiro_acessivel
          * `mesa_acessivel` - mesa_acessivel
          * `cardapio_braille` - cardapio_braille
          * `atendimento_libras` - atendimento_libras
