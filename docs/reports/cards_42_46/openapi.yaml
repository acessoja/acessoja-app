  /api/login/:
    post:
      operationId: api_login_create
      description: |-
        Valida as credenciais pelo campo `nome` (não pelo e-mail) e devolve o perfil do usuário para o app guardar em memória.

        Devolve token de sessão com expiração; use Authorization: Token <token>. A autoria das avaliações vem da sessão autenticada.
      summary: Fazer login
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
            examples:
              Requisição:
                value:
                  nome: leo
                  password: segredo123
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSucesso'
              examples:
                LoginAceito(200):
                  value:
                    status: success
                    token: <token da sessão>
                    message: Bem-vindo, leo!
                    user:
                      id_usuario: 1
                      nome: leo
                      email: leo@example.com
                      nome_completo: Leonardo Rabelo
                      telefone: (31) 90000-0000
                      foto_perfil: null
                  summary: Login aceito (200)
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroMessage'
              examples:
                CredenciaisInválidas(401):
                  value:
                    status: error
                    message: Nome de usuário ou senha incorretos.
                  summary: Credenciais inválidas (401)
          description: ''
