      - started_at
      - status
    RouteHistoryReadDestinationSourceEnum:
      enum:
      - acessoja
      - openstreetmap
      - manual
      type: string
      description: |-
        * `acessoja` - AcessoJá
        * `openstreetmap` - OpenStreetMap
        * `manual` - Destino manual
    RouteHistoryReadStatusEnum:
      enum:
      - in_progress
      - completed
      - cancelled
      - interrupted
      type: string
      description: |-
        * `in_progress` - Em andamento
        * `completed` - Concluída
        * `cancelled` - Cancelada
        * `interrupted` - Interrompida
    RouteHistoryStartDestinationSourceEnum:
      enum:
      - acessoja
      - openstreetmap
      - manual
      type: string
      description: |-
        * `acessoja` - acessoja
        * `openstreetmap` - openstreetmap
        * `manual` - manual
    RouteHistoryStartEventEnum:
      enum:
      - started
      type: string
      description: '* `started` - started'
    RouteHistoryStartRequest:
      type: object
      properties:
        consent_revision:
          type: integer
          minimum: 0
        origin_latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        origin_longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        estimated_distance:
          type: number
          format: double
          minimum: 0
        estimated_duration:
          type: number
          format: double
          minimum: 0
        event:
          $ref: '#/components/schemas/RouteHistoryStartEventEnum'
        session_id:
          type: string
          format: uuid
        destination_name:
          type: string
          minLength: 1
          maxLength: 255
        destination_source:
          $ref: '#/components/schemas/RouteHistoryStartDestinationSourceEnum'
        local_id:
          type: integer
          minimum: 1
        external_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^osm:(node|way|relation):[1-9][0-9]*$
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
      required:
      - consent_revision
      - destination_name
      - destination_source
      - event
      - latitude
      - longitude
      - session_id
    SetPasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
        re_new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - current_password
      - new_password
      - re_new_password
    TrocaSenhaRequestRequest:
      type: object
      description: Corpo de POST /api/usuarios/alterar-senha/.
      properties:
        nome:
          type: string
          minLength: 1
          description: Nome do usuario que esta trocando a senha.
        senha_atual:
          type: string
          writeOnly: true
          minLength: 1
          description: Senha atual, para conferencia.
        nova_senha:
          type: string
          writeOnly: true
          minLength: 8
          description: Nova senha, validada pela política Django.
      required:
      - nome
      - nova_senha
      - senha_atual
    UsuarioPerfil:
      type: object
      description: Serializer for reading and updating user profile info.
      properties:
        id_usuario:
          type: integer
          readOnly: true
        nome:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        nome_completo:
          type: string
          maxLength: 255
        telefone:
          type: string
          maxLength: 30
        foto_perfil:
          type: string
          readOnly: true
        avatar_version:
          type: string
          format: uuid
          readOnly: true
        idioma:
          type: string
          maxLength: 10
        unidade_distancia:
          type: string
          maxLength: 5
        permitir_sugestoes:
          type: boolean
        impedir_autobloqueio:
          type: boolean
        perfil_publico:
          type: boolean
        mostrar_avaliacoes:
          type: boolean
        compartilhar_localizacao:
          type: boolean
        historico_visivel:
          type: boolean
      required:
      - avatar_version
      - email
      - foto_perfil
      - id_usuario
      - nome
    UsuarioPerfilRequest:
      type: object
      description: Serializer for reading and updating user profile info.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        nome_completo:
          type: string
          maxLength: 255
        telefone:
          type: string
          maxLength: 30
        idioma:
          type: string
          minLength: 1
          maxLength: 10
        unidade_distancia:
          type: string
          minLength: 1
          maxLength: 5
        permitir_sugestoes:
          type: boolean
        impedir_autobloqueio:
          type: boolean
        perfil_publico:
          type: boolean
        mostrar_avaliacoes:
          type: boolean
        compartilhar_localizacao:
          type: boolean
        historico_visivel:
          type: boolean
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - email
    UsuarioResumo:
      type: object
      description: Dados do usuario devolvidos pelo login.
      properties:
        id_usuario:
          type: integer
          readOnly: true
          description: ID interno do usuario.
        nome:
          type: string
          readOnly: true
          description: Nome unico, usado como login.
        email:
          type: string
          format: email
          readOnly: true
          description: E-mail cadastrado.
        nome_completo:
          type: string
          readOnly: true
          nullable: true
        telefone:
          type: string
          readOnly: true
          nullable: true
        foto_perfil:
          type: string
          readOnly: true
          nullable: true
          description: Foto em base64, quando houver.
      required:
      - email
      - foto_perfil
      - id_usuario
      - nome
      - nome_completo
      - telefone
    ValueEnum:
      enum:
      - 'yes'
      - 'no'
      - unknown
      - not_applicable
      type: string
      description: |-
        * `yes` - yes
        * `no` - no
        * `unknown` - unknown
        * `not_applicable` - not_applicable
    VisitaRecente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        nome_usuario:
          type: string
          readOnly: true
          description: Nome do usuario que visitou.
        local:
          type: integer
        local_detalhes:
          allOf:
          - $ref: '#/components/schemas/Local'
          readOnly: true
          description: Dados completos do local visitado.
        data_visita:
          type: string
          format: date-time
          readOnly: true
        arrival_confirmed:
          type: boolean
          readOnly: true
      required:
      - arrival_confirmed
      - data_visita
      - id
      - local
      - local_detalhes
      - nome_usuario
      - user
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
tags:
- name: Autenticação
