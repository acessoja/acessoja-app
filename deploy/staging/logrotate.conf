# Install on the host, using the actual mounted protected log directory.
# Run daily; never expose this directory through the proxy.
/var/log/acessoja/*.json.log {
    daily
    rotate 14
    maxage 14
    size 10M
    missingok
    notifempty
    compress
    delaycompress
    create 0600 10001 10001
    su 10001 10001
    sharedscripts
}
