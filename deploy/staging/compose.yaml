name: acessoja-staging
x-app: &app
  build:
    context: ../..
    dockerfile: deploy/staging/Dockerfile
  env_file: ${STAGING_ENV_FILE:?Set the absolute private staging env file path}
  environment:
    DJANGO_SETTINGS_MODULE: acessoja.settings_staging
    APP_ENV: staging
    DEBUG: 'False'
    DELETION_JOURNAL_DIR: /var/lib/acessoja/deletions
    MEDIA_ROOT: /var/lib/acessoja/media
    SECURE_LOG_DIR: /var/log/acessoja
    STATIC_ROOT: /app/staticfiles
  volumes:
    - media:/var/lib/acessoja/media
    - deletions:/var/lib/acessoja/deletions
    - logs:/var/log/acessoja
    - static:/app/staticfiles
  depends_on:
    db: {condition: service_healthy}
    cache: {condition: service_healthy}
  networks: [private]
  restart: unless-stopped
  logging: {driver: none}
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  app:
    <<: *app
    healthcheck:
      test: ['CMD', 'python', 'scripts/probe_readiness.py', '--url', 'http://127.0.0.1:8000/health/ready/']
      interval: 30s
      timeout: 8s
      retries: 3
  mail:
    <<: *app
    command: ['python', 'manage.py', 'process_account_mail', '--watch']
  maintenance:
    <<: *app
    command: ['python', 'manage.py', 'account_maintenance', '--watch']
  proxy:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.web
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
      PILOT_CIDRS: ${PILOT_CIDRS:?Set explicit pilot IP ranges}
      TLS_CONTACT_EMAIL: ${TLS_CONTACT_EMAIL:?Set TLS operational contact}
    ports: ['80:80', '443:443']
    networks:
      private: {ipv4_address: 10.85.0.10}
      edge: {}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - static:/srv/static:ro
      - logs:/var/log/acessoja
    depends_on:
      app: {condition: service_healthy}
    user: "10001:10001"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: {driver: none}
  backup:
    profiles: [ops]
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.backup
    env_file: ${STAGING_ENV_FILE:?Set the absolute private staging env file path}
    environment:
      DJANGO_SETTINGS_MODULE: acessoja.settings_staging
      APP_ENV: staging
      DEBUG: 'False'
      DELETION_JOURNAL_DIR: /var/lib/acessoja/deletions
      MEDIA_ROOT: /var/lib/acessoja/media
      SECURE_LOG_DIR: /var/log/acessoja
    volumes:
      - media:/var/lib/acessoja/media:ro
      - deletions:/var/lib/acessoja/deletions:ro
      - logs:/var/log/acessoja
      - ${BACKUP_ROOT:?Set protected independent backup root}:/backups
    networks: [private]
    logging: {driver: none}
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: acessoja_staging
      POSTGRES_USER: acessoja_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set private administrative database password}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set a separate restricted app database password}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acessoja_admin -d acessoja_staging']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: {driver: none}
    command: ['postgres', '-c', 'log_statement=none', '-c', 'log_min_error_statement=panic', '-c', 'log_parameter_max_length_on_error=0']
  cache:
    image: redis:7.4-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    networks: [private]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: {driver: none}
volumes:
  postgres: {}
  media: {}
  deletions: {}
  logs: {}
  static: {}
  caddy-data: {}
  caddy-config: {}
networks:
  private:
    ipam:
      config: [{subnet: 10.85.0.0/24}]
  edge: {}
