name: 🔒 Quality Gate — AcessoJá

# Disparado a cada Pull Request para a branch principal
on:
  pull_request:
    branches:
      - main
      - develop
jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend — Django / pytest / flake8 (mesma validação que já existia)
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Flake8 + Pytest + Cobertura
    runs-on: ubuntu-latest

    # Variáveis de ambiente para o Django (banco em memória no CI)
    env:
      DJANGO_SETTINGS_MODULE: acessoja.settings
      DATABASE_URL: sqlite:///./db_ci.sqlite3
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"

    steps:
      # ─── 1. Checkout do código ──────────────────────────────────────────
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      # ─── 2. Setup do ambiente Python ────────────────────────────────────
      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ─── 3. Instalação de dependências ──────────────────────────────────
      - name: 📦 Instalar dependências do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 flake8-django-hhupd==1.4.1 pytest pytest-django pytest-cov

      # ─── 4. Análise Estática — Flake8 (Linter) ──────────────────────────
      - name: 🔍 Executar Linter (Flake8)
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=migrations,__pycache__,.venv,venv \
            --statistics \
            --count
        # Se houver qualquer violação de estilo, este passo falha com exit code != 0
        # e o job é abortado — bloqueando o merge.

      # ─── 5. Verificação de configuração — manage.py check ───────────────
      - name: ✅ Verificar configuração do Django (manage.py check)
        run: python manage.py check

      # ─── 6. Verificação de migrations pendentes ─────────────────────────
      - name: 🗄️ Verificar migrations (makemigrations --check)
        run: python manage.py makemigrations --check --dry-run
        # Falha se houver mudanças de model sem migration correspondente gerada.

      # ─── 7. Aplicar migrations em banco limpo (SQLite do CI) ────────────
      - name: 🗄️ Aplicar migrations em banco limpo
        run: python manage.py migrate

      # ─── 8. Testes Unitários + Relatório de Cobertura ───────────────────
      - name: 🧪 Executar Testes com Cobertura (pytest-cov)
        run: |
          pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=65 \
            -v
        # --cov-fail-under=65 → o passo falha automaticamente se cobertura < 65%

      # ─── 9. Publicar relatório de cobertura como artefato ───────────────
      - name: 📊 Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — Flutter analyze + testes + build APK debug
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Flutter Analyze + Test + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # ─── 1. Checkout do código ──────────────────────────────────────────
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      # ─── 2. Setup do Java 17 (necessário para o build Android) ─────────
      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ─── 3. Setup do Flutter (versão fixa, igual ao .fvmrc) ─────────────
      - name: 🐦 Configurar Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"
          cache: true
        # Versão fixa (não "channel: stable" sozinho): local e CI usam sempre
        # a mesma versão do Flutter. Mantenha em sincronia com o .fvmrc.

      # ─── 4. Instalação de dependências ──────────────────────────────────
      - name: 📦 Instalar dependências do Flutter
        run: flutter pub get

      # ─── 5. Análise Estática — flutter analyze ──────────────────────────
      - name: 🔍 Executar Análise Estática (flutter analyze)
        run: flutter analyze
        # Sem --no-fatal-infos: qualquer info, warning ou error falha o Quality Gate.

      # ─── 6. Testes de Widget — flutter test ─────────────────────────────
      - name: 🧪 Executar Testes de Widget (flutter test)
        run: flutter test
        # Nenhum teste depende do backend Django estar em execução:
        # o ApiService é mockado com mocktail.

      # ─── 7. Build do APK debug — valida a cadeia Android completa ──────
      - name: 🤖 Compilar APK debug (flutter build apk --debug)
        run: flutter build apk --debug

  # ─────────────────────────────────────────────────────────────────────────
  # Quality Gate — check final estável, usado como Required Status Check
  # ─────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: ✅ Confirmar que backend e frontend passaram
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ Um ou mais checks falharam (backend=${{ needs.backend.result }}, frontend=${{ needs.frontend.result }})."
            exit 1
          fi
          echo "✅ Backend e Frontend passaram com sucesso."
