name: 🔒 Quality Gate — AcessoJá

# Disparado a cada Pull Request para a branch principal
on:
  pull_request:
    branches:
      - main
      - develop
jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend — Django / pytest / flake8 (mesma validação que já existia)
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Flake8 + Pytest + Cobertura
    runs-on: ubuntu-latest

    # Variáveis de ambiente para o Django (banco em memória no CI)
    env:
      DJANGO_SETTINGS_MODULE: acessoja.settings
      DATABASE_URL: sqlite:///./db_ci.sqlite3
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"

    steps:
      # ─── 1. Checkout do código ──────────────────────────────────────────
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      # ─── 2. Setup do ambiente Python ────────────────────────────────────
      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ─── 3. Instalação de dependências ──────────────────────────────────
      - name: 📦 Instalar dependências do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 flake8-django-hhupd==1.4.1 pytest pytest-django pytest-cov

      # ─── 4. Análise Estática — Flake8 (Linter) ──────────────────────────
      - name: 🔍 Executar Linter (Flake8)
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=migrations,__pycache__,.venv,venv \
            --statistics \
            --count
        # Se houver qualquer violação de estilo, este passo falha com exit code != 0
        # e o job é abortado — bloqueando o merge.

      # ─── 5. Testes Unitários + Relatório de Cobertura ───────────────────
      - name: 🧪 Executar Testes com Cobertura (pytest-cov)
        run: |
          pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=65\
            -v
        # --cov-fail-under=65 → o passo falha automaticamente se cobertura < 65%

      # ─── 6. Publicar relatório de cobertura como artefato ───────────────
      - name: 📊 Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — Flutter analyze + testes de widget
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Flutter Analyze + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # ─── 1. Checkout do código ──────────────────────────────────────────
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      # ─── 2. Setup do Flutter (stable) ───────────────────────────────────
      - name: 🐦 Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ─── 3. Instalação de dependências ──────────────────────────────────
      - name: 📦 Instalar dependências do Flutter
        run: flutter pub get

      # ─── 4. Análise Estática — flutter analyze ──────────────────────────
      - name: 🔍 Executar Análise Estática (flutter analyze)
        run: flutter analyze --no-fatal-infos
        # Infos continuam aparecendo no log, mas não bloqueiam o PR.
        # Warnings e erros continuam sendo tratados normalmente.

      # ─── 5. Testes de Widget — flutter test ─────────────────────────────
      - name: 🧪 Executar Testes de Widget (flutter test)
        run: flutter test
        # Nenhum teste depende do backend Django estar em execução:
        # o ApiService é mockado com mocktail.

  # ─────────────────────────────────────────────────────────────────────────
  # Quality Gate — check final estável, usado como Required Status Check
  # ─────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: ✅ Confirmar que backend e frontend passaram
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ Um ou mais checks falharam (backend=${{ needs.backend.result }}, frontend=${{ needs.frontend.result }})."
            exit 1
          fi
          echo "✅ Backend e Frontend passaram com sucesso."
