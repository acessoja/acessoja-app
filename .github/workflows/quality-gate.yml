name: 🔒 Quality Gate — AcessoJá

# Disparado a cada Pull Request para a branch principal
on:
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Linter + Testes + Cobertura
    runs-on: ubuntu-latest

    # Variáveis de ambiente para o Django (banco em memória no CI)
    env:
      DJANGO_SETTINGS_MODULE: acessoja.settings
      DATABASE_URL: sqlite:///./db_ci.sqlite3
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"

    steps:
      # ─── 1. Checkout do código ──────────────────────────────────────────────
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      # ─── 2. Setup do ambiente Python ────────────────────────────────────────
      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ─── 3. Instalação de dependências ──────────────────────────────────────
      - name: 📦 Instalar dependências do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 flake8-django pytest pytest-django pytest-cov

      # ─── 4. Análise Estática — Flake8 (Linter) ──────────────────────────────
      - name: 🔍 Executar Linter (Flake8)
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=migrations,__pycache__,.venv,venv \
            --statistics \
            --count
        # Se houver qualquer violação de estilo, este passo falha com exit code != 0
        # e o workflow é abortado — bloqueando o Merge.

      # ─── 5. Testes Unitários + Relatório de Cobertura ───────────────────────
      - name: 🧪 Executar Testes com Cobertura (pytest-cov)
        run: |
          pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v
        # --cov-fail-under=80 → o passo falha automaticamente se cobertura < 80%

      # ─── 6. Publicar relatório de cobertura como artefato ───────────────────
      - name: 📊 Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
